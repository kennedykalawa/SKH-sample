<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SokoHub | Login</title>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <nav class="nav-menu">  
            <img src="../sokohubimg/sokohub logo.jpg" alt="SokoHub Logo" class="logo-img">
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../products.html">Our Products</a>
                <a href="../About.html">About Us</a>
                <a href="../Contact us.html">Contact Us</a>
            </div>
            <div id="buttons">
                <a href="../Register.html"><button id="up">Register</button></a>
                <a href="./login.html" class="active"><button id="in">Sign In</button></a>
            </div>
        </nav>
    </header>

    <main class="login-wrapper">
        <div class="login-container">
            <div class="login-branding">
                <img src="../sokohubimg/sokohub logo.jpg" alt="Logo" class="login-logo">
                <h1>Welcome Back</h1>
                <p>Let’s connect, trade, and grow together.</p>
            </div>

            <div class="login-form-box">
                <h2>Sign In</h2>
                <form>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                </form>
                <p class="footer-text">Don't have an account? <a href="sign up.html">Create one</a></p>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SokoHub Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

       <nav>
        <img src="../sokohubimg/sokohub logo.jpg" alt="">
        <section id="logo"></section>
        <section id="home">
            <a href="../index.html">Home</a></section>
        <section id="products">
            <a href="../products.html">our products</a></section>
        <section id="about">
            <a href="../About.html">about us</a>
        </section>
        <section id="contact">
            <a href="../Contact us.html">contact us</a></section>
         <section id="buttons">
            <a href="../Register.html"><button id="up">Register</button></a>
            <a href="./login.html"><button id="in">sign in </button></a>
        </section>
    </nav>

<div class="container">

    <!-- LEFT SIDE - LOGO + TEXT -->
    <div class="left-side">
        <div class="logo-box">
            <img src="logo.jpg" alt="SokoHub Logo">
        </div>

        <h3>Welcome to SokoHub</h3>
        <p class="tagline">
            Let’s connect, trade, and grow together.
        </p>
    </div>

    <!-- RIGHT SIDE - LOGIN FORM -->
    <div class="right-side">
        <h2>Welcome Back</h2>
        <p class="sub-text">Sign in to continue to <strong>SokoHub</strong></p>

        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <p class="switch-page">
                Don't have an account? <a href="sign up.html">Create one here</a>
            </p>
        </form>
    </div>

</div>

</body>
</html>

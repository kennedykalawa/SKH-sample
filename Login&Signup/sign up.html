<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SokoHub - Create Account</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <nav>
        <img src="../sokohubimg/sokohub logo.jpg" alt="">
        <section id="logo"></section>
        <section id="home">
            <a href="../index.html">Home</a></section>
        <section id="products">
            <a href="../products.html">our products</a></section>
        <section id="about">
            <a href="../About.html">about us</a>
        </section>
        <section id="contact">
            <a href="../Contact us.html"></a>contact us</section>
         <section id="buttons">
            <a href="../Register.html"><button id="up">Register</button></a>
            <a href="./login.html"><button id="in">sign in </button></a>
        </section>
    </nav>

<div class="container">
    
    <!-- Left Section: Sign Up Form -->
    <div class="right-side">
        <h2>Create Your Account</h2>
        <p class="subtitle">Join SokoHub and start experiencing convenience 😄</p>

        <form>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required />
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required />
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required />
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required />
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

       
    </div>

    <!-- Right Section: Logo and Message -->
    <div class="logo-box">
        <img src="logo.jpg" class="logo-img" alt="SKH Logo">
        <h1>Welcome to SokoHub</h1>
        <p class="tagline">Your trusted marketplace — simple, fast & reliable.</p>
        <p class="thankyou">Thank you for joining us ❤</p>

         <p class="switch-page">
            Already have an account? 
            <a href="login.html">Login here</a>
            <!-- <div class="home">
            <a href="../index.html"><button class="btn-home">Home 🏠</button></a>
            </div> -->
        </p>
    </div>
    

</div>

</body>
</html>

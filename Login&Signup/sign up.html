<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SokoHub | Sign Up</title>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <nav class="nav-menu">  
            <img src="../sokohubimg/sokohub logo.jpg" alt="SokoHub Logo" class="logo-img">
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../products.html">Our Products</a>
                <a href="../About.html">About Us</a>
                <a href="../Contact us.html">Contact Us</a>
            </div>
            <div id="buttons">
                <a href="../Register.html"><button id="up">Register</button></a>
                <a href="./login.html" class="active"><button id="in">Sign In</button></a>
            </div>
        </nav>
    </header>
    <main class="login-wrapper">
        <div class="login-container">
            <div class="login-form-box">
                <h2>Create Account</h2>
                <form>
                    <div class="input-group"><label>Full Name</label><input type="text" required></div>
                    <div class="input-group"><label>Email</label><input type="email" required></div>
                    <div class="input-group"><label>Password</label><input type="password" required></div>
                    <button type="submit" class="auth-btn">Register</button>
                </form>
                <p class="footer-text">Already have an account? <a href="login.html">Login</a></p>
            </div>
            <div class="login-branding">
                <img src="./logo.jpg" alt="">
                <h1>Join SokoHub</h1>
                <p>Start your journey in the most reliable marketplace.</p>
            </div>
        </div>
    </main>
</body>
</html>

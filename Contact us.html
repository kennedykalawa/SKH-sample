<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoHub | Contact Us</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav-menu">  
                <img src="./sokohubimg/sokohub logo.jpg" alt="SokoHub Logo" class="logo-img">
                <div class="nav-links">
                    <a href="./index.html">Home</a>
                    <a href="./products.html">Our Products</a>
                    <a href="./About.html">About Us</a>
                    <a href="./Contact us.html" class="active">Contact Us</a>
                </div>
                <div id="buttons">
                    <a href="./Register.html"><button id="up">Register</button></a>
                    <a href="./Login&Signup/login.html"><button id="in">Sign In</button></a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="contact-hero-flex">
            <h1>Contact SokoHub Support</h1>
            <p class="lead">We're here to help! Send us a message or use the contact details below.</p>
        </section>

        <div class="contact-wrapper-flex">
            <div class="contact-form-container">
                <form action="#" method="POST" class="flex-form">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input type="text" id="subject" name="subject" required placeholder="Regarding my order, partnership, etc.">
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message:</label>
                        <textarea id="message" name="message" required placeholder="Type your detailed message here..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn-flex">Send Message</button>
                </form>
            </div>

            <aside class="contact-info-flex">
                <div class="info-card">
                    <h2>Direct Contact</h2>
                    <p><strong>Email:</strong> <a href="mailto:support@sokohub.com">support@sokohub.com</a></p>
                    <p><strong>Phone:</strong> <a href="tel:+254123456789">+254 123 456 789</a></p>
                    <div class="address-box">
                        <p><strong>Office:</strong></p>
                        <p>123 Market Street, Kutus,<br>Kirinyaga, Kenya</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>

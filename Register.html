<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoHub | Register</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav-menu-flex">  
                <img src="./sokohubimg/sokohub logo.jpg" alt="SokoHub Logo" class="logo-img">
                <div class="nav-links-flex">
                    <a href="./index.html">Home</a>
                    <a href="./products.html">Our Products</a>
                    <a href="./About.html">About Us</a>
                    <a href="./Contact us.html">Contact Us</a>
                </div>
                <div id="buttons-flex">
                    <a href="./Register.html" class="active"><button id="up">Register</button></a>
                    <a href="./Login&Signup/login.html"><button id="in">Sign In</button></a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="register-wrapper-flex">
            <div class="register-card-flex">
                <div class="register-header-flex">
                    <h2>Welcome to SokoHub</h2>
                    <p>We're very happy to have you! Choose how you want to join us:</p>
                </div>
                
                <div class="role-selection-flex">
                    <a href="./sellers.page.html" class="role-btn-flex">
                        <span class="icon">🏪</span>
                        <span>Seller</span>
                    </a>
                    <a href="./Login&Signup/sign up.html" class="role-btn-flex">
                        <span class="icon">🛍️</span>
                        <span>Buyer / Customer</span>
                    </a>
                    <a href="./delivery.html" class="role-btn-flex">
                        <span class="icon">🚚</span>
                        <span>Delivery Personnel</span>
                    </a>
                </div>

                <div class="home-return-flex">
                    <a href="./index.html" class="home-circle-btn">🏠</a>
                    <p>Back to Home</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

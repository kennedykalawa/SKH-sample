<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoHub | Register</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header-flex">
        <div class="container">
            <nav class="nav-menu-flex">  
                <img src="./sokohubimg/sokohub logo.jpg" alt="SokoHub Logo" class="logo-img">
                <div class="menu-toggle-flex">
                    <span></span><span></span><span></span>
                </div>
                <div class="nav-links-flex">
                    <a href="./index.html">Home</a>
                    <a href="./products.html">Our Products</a>
                    <a href="./About.html">About Us</a>
                    <a href="./Contact us.html">Contact Us</a>
                </div>
                <div class="auth-buttons-flex">
                    <a href="./Register.html" class="active"><button class="btn-up-flex">Register</button></a>
                    <a href="./Login&Signup/login.html"><button class="btn-in-flex">Sign In</button></a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: center; align-items: center; padding: 60px 0; min-height: 70vh;">
            <div class="form-container-flex" style="max-width: 500px; width: 100%; text-align: center;">
                <h2 style="color: var(--accent-color); font-size: 2.2rem; margin-bottom: 10px;">Welcome to SokoHub</h2>
                <p style="color: var(--text-light); margin-bottom: 30px;">Choose how you want to join our community:</p>
                
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <a href="./sellers.page.html" class="btn-submit-flex" style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; padding: 18px;">
                        <span>🏪</span> Seller
                    </a>
                    <a href="./Login&Signup/sign up.html" class="btn-submit-flex" style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; padding: 18px;">
                        <span>🛍️</span> Buyer / Customer
                    </a>
                    <a href="./delivery.html" class="btn-submit-flex" style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; padding: 18px;">
                        <span>🚚</span> Delivery Partner
                    </a>
                </div>

                <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                    <a href="./index.html" style="color: var(--primary-color); font-weight: bold;">🏠 Back to Home</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-flex">
        <div class="container">
            <div class="footer-bottom-flex">
                <p>&copy; 2026 SokoHub Marketplace. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
